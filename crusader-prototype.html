<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crusader — игровой прототип</title>
<style>
:root{--gold:#e8c36a;--panel:#171b20eF;--line:#8f7442;--text:#f7ebce}*{box-sizing:border-box}body{margin:0;background:#15191c;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100dvh;touch-action:none;background:#c6a66d}.top{position:absolute;z-index:2;left:8px;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}.resource{background:var(--panel);border:1px solid #806a42;border-radius:8px;padding:6px 9px;min-width:68px;box-shadow:0 2px 8px #0005}.resource b{color:var(--gold);display:block;font-size:15px}.resource small{color:#c4d5a4;font-size:10px}.lord{margin-left:auto;background:#15243b;border:1px solid #b69b5a;padding:7px 10px;border-radius:8px}.bottom{position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:end;gap:8px;z-index:3}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;box-shadow:0 3px 12px #0006}.stats{width:190px;max-height:38vh;overflow:auto;font-size:12px}.stats strong{color:var(--gold)}.builds{display:flex;gap:6px;flex:1;overflow-x:auto;padding:5px;scrollbar-width:thin}.build{min-width:72px;min-height:66px;color:var(--text);background:#33332b;border:1px solid #947a49;border-radius:8px;padding:7px 5px;font-size:11px}.build span{display:block;font-size:22px;margin-bottom:3px}.build.active{outline:2px solid #f1d17d;background:#5a492c}.actions{display:flex;flex-direction:column;gap:6px}.actions button,.settings button{color:var(--text);background:#39372e;border:1px solid #9c804a;border-radius:7px;padding:8px}.settings{position:absolute;right:8px;top:78px;width:210px;z-index:3;font-size:12px}.settings label{display:block;margin:5px 0}.settings select{max-width:100%;background:#25272a;color:white;border:1px solid #867149;border-radius:5px;padding:4px}.toast{position:absolute;top:112px;left:50%;transform:translateX(-50%);z-index:5;background:#171b20ee;border:1px solid var(--gold);border-radius:8px;padding:9px 13px;max-width:90%;text-align:center;display:none}.hint{position:absolute;left:50%;top:73px;transform:translateX(-50%);background:#181a1bcc;padding:5px 9px;border-radius:6px;font-size:11px;white-space:nowrap;pointer-events:none}@media(max-width:600px){.resource{min-width:53px;padding:5px 6px}.resource b{font-size:13px}.resource small{font-size:9px}.lord{display:none}.bottom{align-items:stretch;flex-direction:column}.stats{width:auto;max-height:17vh}.builds{order:2}.actions{position:absolute;right:0;bottom:75px}.settings{top:74px;width:164px;font-size:11px}.hint{top:57px;font-size:10px}.build{min-width:66px}.top{right:5px;left:5px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top">
<div class="resource">🪙 <b id="gold">450</b><small id="goldRate">0/день</small></div>
<div class="resource">🪵 <b id="wood">120</b><small>Дерево</small></div>
<div class="resource">🪨 <b id="stone">80</b><small>Камень</small></div>
<div class="resource">🍞 <b id="food">90</b><small>Еда в амбаре</small></div>
<div class="resource">👥 <b id="pop">8/8</b><small>Население</small></div>
<div class="lord">⚜ СТАХИЙ · Лорд</div>
</div>
<div class="hint" id="hint">Выбери постройку снизу, затем нажми на карту</div>
<div class="settings panel">
<div><strong>Управление поместьем</strong></div>
<label>Налог: <select id="tax"><option value="-7">Большая щедрость (−7 зол./день)</option><option value="-2">Низкий</option><option value="0" selected>Нет налога</option><option value="5">Умеренный (+5)</option><option value="12">Высокий (+12)</option><option value="24">Жестокий гнёт (+24)</option></select></label>
<label>Рацион: <select id="ration"><option value="-8">Нет еды (−8)</option><option value="-4">Половина пайка (−4)</option><option value="0" selected>Обычный (0)</option><option value="4">Полный паёк (+4)</option><option value="8">Двойной паёк (+8)</option></select></label>
<label>Порядок: <select id="fear"><option value="0">Нейтральный</option><option value="5">Добрые постройки (+5)</option><option value="-5">Жестокие постройки (−5)</option></select></label>
<div>Популярность: <strong id="popularity">50</strong>/100</div>
<div style="height:6px;background:#433b2e;border-radius:5px;overflow:hidden"><div id="popbar" style="height:100%;width:50%;background:#9dc16c"></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="bottom">
<div class="panel stats">
<div><strong>День <span id="day">1</span></strong> · <span id="status">Поместье основано</span></div>
<div>Рабочие: <strong id="workers">0/0</strong> · Свободные: <strong id="free">8</strong></div>
<div>Место в домах: <strong id="housing">8</strong></div>
<div>Еда: <strong id="foodStatus">запас</strong> · Производство: <strong id="production">ожидает рабочих</strong></div>
<div style="margin-top:5px"><button id="save">💾 Сохранить</button> <button id="reset">↻ Сброс</button></div>
</div>
<div class="panel builds" id="builds">
<button class="build active" data-type="hut"><span>🛖</span>Хижина<br>30🪵</button>
<button class="build" data-type="orchard"><span>🍎</span>Яблоневый сад<br>25🪵</button>
<button class="build" data-type="wheat"><span>🌾</span>Пшеничная ферма<br>35🪵</button>
<button class="build" data-type="mill"><span>⚙️</span>Мельница<br>50🪵 10🪨</button>
<button class="build" data-type="bakery"><span>🥖</span>Пекарня<br>35🪵 5🪨</button>
<button class="build" data-type="lumber"><span>🪓</span>Дровосек<br>25🪵</button>
<button class="build" data-type="quarry"><span>⛏️</span>Каменоломня<br>30🪵</button>
<button class="build" data-type="church"><span>⛪</span>Церковь<br>60🪵 30🪨</button>
<button class="build" data-type="tavern"><span>🍺</span>Таверна<br>40🪵 10🪨</button>
<button class="build" data-type="garden"><span>🌳</span>Сад<br>20🪵</button>
<button class="build" data-type="gallows"><span>⚒️</span>Виселица<br>15🪵</button>
</div>
<div class="actions"><button id="rotate">⟳ Камера</button><button id="speed">▶ Время ×1</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const types={
hut:{name:'Хижина',wood:30,stone:0,workers:0,cap:8,emoji:'🏠'},orchard:{name:'Яблоневый сад',wood:25,stone:0,workers:1,food:3,green:true,emoji:'🍎'},wheat:{name:'Пшеничная ферма',wood:35,stone:0,workers:1,wheat:4,green:true,emoji:'🌾'},mill:{name:'Мельница',wood:50,stone:10,workers:1,flour:5,emoji:'⚙️'},bakery:{name:'Пекарня',wood:35,stone:5,workers:1,bread:6,emoji:'🥖'},lumber:{name:'Дровосек',wood:25,stone:0,workers:1,woodRate:5,emoji:'🪓'},quarry:{name:'Каменоломня',wood:30,stone:0,workers:1,stoneRate:3,rock:true,emoji:'⛏️'},church:{name:'Церковь',wood:60,stone:30,workers:1,faith:3,emoji:'⛪'},tavern:{name:'Таверна',wood:40,stone:10,workers:1,ale:3,emoji:'🍺'},garden:{name:'Сад',wood:20,stone:0,workers:0,kindness:2,emoji:'🌳'},gallows:{name:'Виселица',wood:15,stone:0,workers:0,cruelty:2,emoji:'⚒️'}
};
let state,selected='hut',rotation=0,speed=1,dayTimer=0,last=0,toastTimer=0,scale=1,offsetX=0,offsetY=0,drag=null;
const initial=()=>({gold:450,wood:120,stone:80,food:90,flour:0,wheat:0,pop:8,free:8,day:1,popularity:50,buildings:[],workers:0,housing:8,foodTypes:1,oxen:0});
function load(){try{const s=localStorage.getItem('crusaderPrototypeSave');state=s?JSON.parse(s):initial()}catch(e){state=initial()}if(!state.buildings)state.buildings=[];state.housing=Math.max(8,state.housing||8);updateUI()}
const tile=1, cols=24, rows=24, world=[];
function iso(x,z){let a=x-12,b=z-12;for(let i=0;i<rotation;i++)[a,b]=[-b,a];return{x:(a-b)*24*scale+innerWidth/2+offsetX,y:(a+b)*12*scale+innerHeight*.43+offsetY}}
function uniso(px,py){let best={x:12,z:12,d:1e9};for(let x=0;x<cols;x++)for(let z=0;z<rows;z++){let p=iso(x,z),d=(p.x-px)**2+(p.y-py)**2;if(d<best.d)best={x,z,d}}return best}
function rng(x,z){let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function terrain(x,z){if(x<1||z<1||x>22||z>22)return'sand';if((x-5)**2+(z-5)**2<12)return'water';if((x-17)**2+(z-7)**2<18)return'oasis';if((x-18)**2+(z-17)**2<10)return'iron';if((x-4)**2+(z-18)**2<8)return'rock';return'sand'}
function polygon(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(p,w,h,fill,stroke){polygon([{x:p.x,y:p.y-h/2},{x:p.x+w/2,y:p.y},{x:p.x,y:p.y+h/2},{x:p.x-w/2,y:p.y}],fill,stroke)}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function text(str,p,size=12,color='#fff'){ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#32271c';ctx.strokeText(str,p.x,p.y);ctx.fillStyle=color;ctx.fillText(str,p.x,p.y)}
function buildingAt(x,z){return state.buildings.find(b=>b.x===x&&b.z===z)}
function drawTree(x,z){let p=iso(x,z);ctx.fillStyle='#5c4128';ctx.fillRect(p.x-2,p.y-16,4,17);for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(p.x,p.y-36-k*5);ctx.lineTo(p.x-12+k*2,p.y-13-k*5);ctx.lineTo(p.x+12-k*2,p.y-13-k*5);ctx.closePath();ctx.fillStyle=['#456336','#5c7c3b','#78984a'][k];ctx.fill();}}
function drawHouse(p,kind){let base=kind==='keep'?24:kind==='tower'?15:10,h=kind==='keep'?42:kind==='tower'?28:17,w=kind==='keep'?30:kind==='tower'?20:16;polygon([{x:p.x-w,y:p.y},{x:p.x-w,y:p.y-h},{x:p.x,y:p.y-h-8},{x:p.x,y:p.y}],kind==='keep'?'#9b8060':'#a9916e','#5a4836');polygon([{x:p.x,y:p.y-h-8},{x:p.x+w,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y}],kind==='keep'?'#75624e':'#7b674f','#4e4131');polygon([{x:p.x-w,y:p.y-h},{x:p.x,y:p.y-h-15},{x:p.x+w,y:p.y-h},{x:p.x,y:p.y-h+4}],kind==='keep'?'#d2bd94':'#bba47d','#6e5739');if(kind==='tower'||kind==='keep'){for(let i=-1;i<=1;i++)ctx.fillRect(p.x+i*7-2,p.y-h-19,4,6);ctx.fillStyle='#254f91';ctx.fillRect(p.x+3,p.y-h-28,2,17);polygon([{x:p.x+4,y:p.y-h-28},{x:p.x+17,y:p.y-h-23},{x:p.x+4,y:p.y-h-18}],'#2f62a7');}}
function drawBuilding(b){let p=iso(b.x,b.z),t=types[b.type];if(!t)return;if(b.type==='hut'){drawHouse(p,'house');return}if(b.type==='church'){drawHouse(p,'house');polygon([{x:p.x-6,y:p.y-30},{x:p.x,y:p.y-39},{x:p.x+6,y:p.y-30}], '#a99c83');line({x:p.x,y:p.y-43},{x:p.x,y:p.y-34},'#e4d7b6',2);return}if(b.type==='quarry'){for(let i=0;i<3;i++){let q={x:p.x+(i-1)*9,y:p.y-i%2*5};polygon([{x:q.x-7,y:q.y},{x:q.x-4,y:q.y-11},{x:q.x+4,y:q.y-13},{x:q.x+8,y:q.y-3}], '#827d73','#514c45')}return}if(b.type==='orchard'||b.type==='garden'){for(let i=0;i<4;i++){let q=iso(b.x+(i%2)*.35,b.z+Math.floor(i/2)*.35);ctx.beginPath();ctx.arc(q.x+(i%2)*5-3,q.y-9,7,0,Math.PI*2);ctx.fillStyle=b.type==='orchard'?'#5f873d':'#2e713d';ctx.fill();if(b.type==='orchard'){ctx.fillStyle='#d95439';ctx.beginPath();ctx.arc(q.x, q.y-10,2,0,7);ctx.fill()}}return}if(b.type==='wheat'){diamond(p,34,18,'#879d43');for(let i=0;i<4;i++)line({x:p.x-12+i*7,y:p.y-1},{x:p.x-10+i*7,y:p.y-10},'#e3c45f',2);return}if(b.type==='tavern'){drawHouse(p,'house');text('🍺',{x:p.x,y:p.y-23},12);return}if(b.type==='lumber'){drawHouse(p,'house');line({x:p.x-14,y:p.y-3},{x:p.x+12,y:p.y-3},'#62452c',3);return}drawHouse(p,'house');}
function render(){const dpr=Math.min(devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;if(canvas.width!==Math.floor(w*dpr)||canvas.height!==Math.floor(h*dpr)){canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(w/850,h/570,1.15);ctx.clearRect(0,0,w,h);ctx.fillStyle='#c9aa70';ctx.fillRect(0,0,w,h);
for(let z=0;z<rows;z++)for(let x=0;x<cols;x++){let p=iso(x,z),t=terrain(x,z),c=t==='water'?'#367e9b':t==='oasis'?'#82944b':t==='rock'?'#b6a18a':t==='iron'?'#9d8774':(rng(x,z)>.82?'#c6a66c':'#d5b77f');diamond(p,48*scale,24*scale,c,'#0000000b');if(t==='water'){line({x:p.x-10*scale,y:p.y},{x:p.x+9*scale,y:p.y+2*scale},'#6db4c3',1)}if(t==='oasis'&&rng(x,z)>.78)drawTree(x,z);if(t==='rock'&&rng(x,z)>.55){polygon([{x:p.x-8,y:p.y},{x:p.x-3,y:p.y-9},{x:p.x+4,y:p.y-11},{x:p.x+9,y:p.y}], '#8d887c','#6b6256')}} 
// Fortress walls and moat, centered in map
const wall=[{x:8,z:9},{x:15,z:9},{x:15,z:15},{x:8,z:15}];
wall.forEach((v,i)=>{let n=wall[(i+1)%wall.length],a=iso(v.x,v.z),b=iso(n.x,n.z);line({x:a.x,y:a.y-8},{x:b.x,y:b.y-8},'#597c8b',15*scale);line({x:a.x,y:a.y-13},{x:b.x,y:b.y-13},'#b8a17c',9*scale);for(let k=0;k<7;k++){let t=k/7,p={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t-18*scale};ctx.fillStyle='#d2bf9d';ctx.fillRect(p.x-2*scale,p.y,4*scale,5*scale)}});
[{x:8,z:9},{x:15,z:9},{x:15,z:15},{x:8,z:15}].forEach(v=>drawHouse(iso(v.x,v.z),'tower'));drawHouse(iso(11,z=11),'keep');drawHouse(iso(12,13),'house');drawHouse(iso(10,13),'house');
// gate and bridge
let gate=iso(11,15);polygon([{x:gate.x-15,y:gate.y-4},{x:gate.x-15,y:gate.y-28},{x:gate.x+15,y:gate.y-28},{x:gate.x+15,y:gate.y-4}], '#79553b','#4e3829');ctx.fillStyle='#2c2118';ctx.fillRect(gate.x-7,gate.y-23,14,20);for(let i=0;i<6;i++)line({x:gate.x-7+i*3,y:gate.y-22},{x:gate.x-7+i*3,y:gate.y-4},'#b28b54',1);
for(let i=0;i<state.buildings.length;i++)drawBuilding(state.buildings[i]);
// small people
for(let i=0;i<Math.min(state.pop,14);i++){let p=iso(9+(i%5)*1.15,16+Math.floor(i/5)*.8);ctx.fillStyle=i%3===0?'#294e8c':'#79553a';ctx.beginPath();ctx.arc(p.x,p.y-8,2.4,0,7);ctx.fill();line({x:p.x,y:p.y-6},{x:p.x,y:p.y},'#e9d5ad',2)}
// selected tile highlight
if(selected){let p=iso(cursor.x,cursor.z);diamond(p,46*scale,23*scale,'#e5d08a55','#fff0ad');}
}
let cursor={x:12,z:17};
function updateUI(){if(!state)return;for(const k of ['gold','wood','stone','food'])$(k).textContent=Math.floor(state[k]);$('pop').textContent=state.pop+'/'+state.housing;$('day').textContent=state.day;$('workers').textContent=state.workers+'/'+Math.max(0,state.pop-state.free);$('free').textContent=state.free;$('housing').textContent=state.housing;$('popularity').textContent=state.popularity;$('popbar').style.width=state.popularity+'%';$('popbar').style.background=state.popularity>=50?'#9dc16c':'#c45a48';$('goldRate').textContent=(Number($('tax').value)>=0?'+':'')+$('tax').value+'/день';$('foodStatus').textContent=state.food>0?'запас есть':'голод';$('production').textContent=state.workers?'работает':'ожидает рабочих';}
function notify(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2300)}
function occupied(x,z){return state.buildings.some(b=>Math.abs(b.x-x)<1.1&&Math.abs(b.z-z)<1.1)||((x>=8&&x<=15&&z>=9&&z<=15))}
function build(x,z){const t=types[selected];if(!t)return;if(x<1||z<1||x>22||z>22){notify('Нельзя строить за пределами карты.');return}if(occupied(x,z)){notify('Участок занят замком или другой постройкой.');return}if(t.green&&terrain(x,z)!=='oasis'){notify('Эта ферма требует зелёную землю оазиса.');return}if(t.rock&&terrain(x,z)!=='rock'){notify('Каменоломня строится только на залежах камня.');return}if(state.wood<t.wood||state.stone<t.stone){notify('Не хватает ресурсов на складе.');return}if(t.cap&&state.housing>=120){notify('Лимит населения прототипа достигнут.');return}state.wood-=t.wood;state.stone-=t.stone;state.buildings.push({type:selected,x,z,progress:0,worker:false});if(t.cap)state.housing+=t.cap;const b=state.buildings[state.buildings.length-1];if(t.workers){if(state.free>0){state.free--;state.workers++;b.worker=true;notify(t.name+' построено. Рабочий назначен.')}else notify(t.name+' построено, но простаивает: нет свободных крестьян.')}else notify(t.name+' построено.');updateUI();render()}
function tick(){state.day++;let tax=Number($('tax').value),ration=Number($('ration').value),fear=Number($('fear').value);let diversity=state.food>20?Math.min(3,Math.max(0,state.foodTypes-1)):0;let faith=Math.min(8,state.buildings.filter(b=>b.type==='church').length*2),ale=Math.min(8,state.buildings.filter(b=>b.type==='tavern').length*2);state.popularity=Math.max(0,Math.min(100,50+(tax===0?-50:tax<0?7:tax<=5?2:tax<=12?-8:-24)+ration+diversity+faith+ale+fear));if(state.popularity>=50&&state.pop<state.housing&&state.free<10){state.pop++;state.free++}else if(state.popularity<50&&state.pop>1){state.pop--;if(state.free>0)state.free--;else if(state.workers>0){state.workers--;let b=state.buildings.find(b=>b.worker);if(b)b.worker=false}}
state.gold=Math.max(0,state.gold+tax);if(state.food>0){state.food=Math.max(0,state.food-Math.max(1,Math.ceil(state.pop/12)*(ration>=8?2:ration>=4?1:0.5)))}else state.popularity=Math.max(0,state.popularity-3);
let staffed=state.buildings.filter(b=>b.worker);for(const b of staffed){const t=types[b.type];if(b.type==='lumber')state.wood+=t.woodRate;if(b.type==='quarry')state.stone+=t.stoneRate;if(b.type==='orchard')state.food+=t.food;if(b.type==='wheat')state.wheat+=t.wheat;if(b.type==='mill'&&state.wheat>0){state.wheat--;state.flour+=t.flour}if(b.type==='bakery'&&state.flour>0){state.flour--;state.food+=t.bread}if(b.type==='church'){}if(b.type==='tavern'&&state.gold>0)state.gold=Math.max(0,state.gold-1)}
state.wood=Math.min(9999,state.wood);state.stone=Math.min(9999,state.stone);state.food=Math.min(9999,state.food);state.gold=Math.min(99999,state.gold);updateUI();render();notify('Начался день '+state.day+'.')}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointermove',e=>{const p=pointer(e);cursor=uniso(p.x,p.y);if(drag){offsetX+=p.x-drag.x;offsetY+=p.y-drag.y;drag={x:p.x,y:p.y};render()}});
canvas.addEventListener('pointerdown',e=>{const p=pointer(e);drag={x:p.x,y:p.y,ox:p.x,oy:p.y,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const p=pointer(e),d=Math.hypot(p.x-drag.ox,p.y-drag.oy);drag=null;if(d<8){const cell=uniso(p.x,p.y);build(cell.x,cell.z)}render()});
document.querySelectorAll('.build').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.type;document.querySelectorAll('.build').forEach(x=>x.classList.toggle('active',x===b));$('hint').textContent='Выбрано: '+types[selected].name+' · нажми на свободный участок';}));
$('rotate').onclick=()=>{rotation=(rotation+1)%4;render()};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='▶ Время ×'+speed};
$('save').onclick=()=>{localStorage.setItem('crusaderPrototypeSave',JSON.stringify(state));notify('Сохранение записано на этом устройстве.')};
$('reset').onclick=()=>{if(confirm('Начать прототип заново?')){state=initial();updateUI();render();notify('Новая игра.')}};
['tax','ration','fear'].forEach(id=>$(id).addEventListener('change',()=>{updateUI();render()}));
function loop(ts){if(!last)last=ts;dayTimer+=(ts-last)*speed;last=ts;if(dayTimer>12000){dayTimer=0;tick()}requestAnimationFrame(loop)}
load();if(!state.buildings.length){state.buildings=[{type:'hut',x:17,z:8},{type:'lumber',x:18,z:9,worker:true},{type:'orchard',x:18,z:6,worker:true}];state.workers=2;state.free=Math.max(0,state.pop-state.workers);state.housing=16;}updateUI();render();requestAnimationFrame(loop);addEventListener('resize',render);
})();
</script>
