name: Extract Kenney assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore uploaded archive
        run: |
          ARCHIVE_COMMIT="e73be718456a97fb81002d3e959f360822e61d75"
          if [ ! -f kenney_retro-medieval-kit.zip ]; then
            git fetch origin "$ARCHIVE_COMMIT"
            git show "$ARCHIVE_COMMIT:kenney_retro-medieval-kit.zip" > /tmp/kenney_retro-medieval-kit.zip
            echo "Restored archive from the earlier upload commit."
          else
            cp kenney_retro-medieval-kit.zip /tmp/kenney_retro-medieval-kit.zip
          fi
          unzip -t /tmp/kenney_retro-medieval-kit.zip
          command -v unzip

      - name: Extract assets
        run: |
          mkdir -p public/assets/kenney
          unzip -o /tmp/kenney_retro-medieval-kit.zip -d public/assets/kenney
          echo "Extracted file count:"
          find public/assets/kenney -type f | wc -l
          echo "Sample files:"
          find public/assets/kenney -type f | head -80

      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/kenney
          if git diff --cached --quiet; then
            echo "No extracted asset changes to commit."
            exit 0
          fi
          git commit -m "Extract Kenney medieval assets"
          git push origin HEAD:main
