<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172019">
<title>KINGDOMS — 3D королевство</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172019;color:#f5eedb;font-family:Arial,Helvetica,sans-serif}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.top{position:fixed;z-index:2;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 10px;background:linear-gradient(110deg,#111a18f5,#1d2924e8);border:1px solid #9b8652;border-radius:12px;box-shadow:0 5px 18px #0007}.brand{font-weight:900;letter-spacing:.08em;color:#e9c36f;margin-right:auto}.resource{background:#0b1413c9;border:1px solid #6e684d;border-radius:8px;padding:6px 8px;font-size:12px;white-space:nowrap}.resource b{color:#f4d18a}.tag{font-size:11px;color:#d8d4bf}.side{position:fixed;z-index:2;left:9px;top:96px;display:grid;gap:6px}.side button,.bottom button,.top button{border:1px solid #a38c58;background:linear-gradient(#26342fef,#111b18f5);color:#f5e7c5;border-radius:9px;padding:10px;font-weight:700;box-shadow:0 3px 10px #0006}.side button{width:94px;text-align:left;font-size:12px}.side button span{display:block;font-size:20px;margin-bottom:3px}.side button.active,.bottom button.active{background:linear-gradient(#e8c56f,#ad792b);color:#211b10}.bottom{position:fixed;z-index:2;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:8px;background:#111a18ed;border:1px solid #9b8652;border-radius:12px}.bottom button{font-size:12px;padding:9px 11px}.status{position:fixed;z-index:2;right:10px;top:96px;max-width:45vw;padding:9px 11px;border:1px solid #a38c58;border-radius:9px;background:#101916e8;font-size:12px;line-height:1.4}.toast{position:fixed;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%);padding:11px 15px;border:1px solid #e3c276;border-radius:10px;background:#111a18ed;text-align:center;max-width:85vw;pointer-events:none}.hidden{display:none!important}.minimap{position:fixed;z-index:2;left:10px;bottom:88px;width:100px;height:74px;border:1px solid #c4a767;border-radius:8px;background:linear-gradient(145deg,#496844,#203e34 60%,#245a7a);opacity:.85;overflow:hidden}.minimap:before{content:'';position:absolute;left:46%;top:-20%;width:22px;height:150%;background:#337fa0;transform:rotate(30deg);border-left:2px solid #91c7cb;border-right:2px solid #91c7cb}.minimap:after{content:'◆';position:absolute;left:48%;top:40%;color:#f3d57c;font-size:16px;text-shadow:0 1px 4px #000}.help{position:fixed;right:10px;bottom:90px;z-index:2;font-size:11px;color:#f1e6ca;background:#111a18d9;padding:7px 9px;border-radius:8px;max-width:55vw;text-align:right}
@media(max-width:600px){.top{gap:4px;padding:6px}.brand{font-size:12px}.resource{font-size:10px;padding:5px}.side{top:104px}.side button{width:76px;padding:7px;font-size:10px}.side button span{font-size:17px}.status{top:104px;font-size:10px;max-width:43vw}.bottom{gap:4px;padding:6px}.bottom button{font-size:10px;padding:8px 9px}.minimap{width:76px;height:58px;bottom:100px}.help{bottom:100px;font-size:10px}}
</style>
</head>
<body>
<canvas id="world" aria-label="Трёхмерная карта королевства KINGDOMS"></canvas>
<div class="top"><div class="brand">⚔ KINGDOMS</div><div class="tag" id="rulerTag">Лорд · Уровень 3</div><div class="resource">🪵 <b id="wood">120</b></div><div class="resource">🪨 <b id="stone">90</b></div><div class="resource">🌾 <b id="food">150</b></div><div class="resource">🪙 <b id="gold">85</b></div><button id="saveBtn">Сохранить</button></div>
<div class="side"><button id="cameraBtn"><span>◉</span>Обзор</button><button id="buildMode"><span>⚒</span>Строить</button><button id="gather"><span>♜</span>Сбор</button><button id="resetView"><span>⌖</span>Центр</button></div>
<div class="status" id="status">Королевство развивается<br>Выбери постройку внизу</div>
<div class="minimap"></div><div class="help">Проводи пальцем — вращение<br>Коснись земли — действие<br>Масштаб — колесо / жест</div>
<div class="bottom" id="bottom"><button data-build="keep">🏰 Крепость</button><button data-build="house">🏠 Дом · 18🪵</button><button data-build="lumberMill">🪚 Лесопилка · 30🪵</button><button data-build="quarry">⛏ Каменоломня · 22🪵</button><button data-build="farm">🌾 Ферма · 28🪵</button><button data-build="barracks">⚔ Казармы · 36🪵</button></div>
<div id="toast" class="toast">Загружаем королевство…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const SAVE='kingdoms-3d-save-v2',canvas=document.getElementById('world'),toast=document.getElementById('toast'),status=document.getElementById('status');
const state={ruler:'Стахий',resources:{wood:120,stone:90,food:150,gold:85},buildings:{'0,0':'keep','-2,1':'house','2,1':'house','-1,3':'lumberMill','3,3':'farm'},selected:null};
const COST={house:{wood:18},lumberMill:{wood:30,stone:12},quarry:{wood:22,stone:8},farm:{wood:28,stone:12,gold:10},barracks:{wood:36,stone:24,gold:18},keep:{wood:70,stone:80}};
const NAMES={keep:'Крепость',house:'Жилой дом',lumberMill:'Лесопилка',quarry:'Каменоломня',farm:'Ферма',barracks:'Казармы'};
let scene,camera,renderer,raycaster,ground,world,ready=false,down=null,lastX=0,lastY=0,drag=false,zoom=1;
const say=(s)=>{toast.textContent=s;toast.classList.remove('hidden');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.add('hidden'),2200)};
function save(){try{localStorage.setItem(SAVE,JSON.stringify({ruler:state.ruler,resources:state.resources,buildings:state.buildings}));say('Прогресс сохранён на устройстве.')}catch(e){say('Не удалось сохранить: проверь настройки браузера.')}}
function restore(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(!d||!d.resources||!d.buildings)return;state.ruler=typeof d.ruler==='string'?d.ruler:'Стахий';for(const k of Object.keys(state.resources))if(Number.isFinite(+d.resources[k]))state.resources[k]=Math.max(0,+d.resources[k]);if(d.buildings&&typeof d.buildings==='object')state.buildings={...state.buildings,...d.buildings};}catch(e){}}
function hud(){for(const k of Object.keys(state.resources))document.getElementById(k).textContent=Math.floor(state.resources[k]);document.getElementById('rulerTag').textContent=state.ruler+' · Уровень 3';}
function mat(c,rough=1,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function mesh(geo,material,x,y,z,parent=world){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function box(w,h,d,c,x,y,z,parent=world){return mesh(new THREE.BoxGeometry(w,h,d),mat(c),x,y,z,parent)}
function cylinder(rt,rb,h,c,x,y,z,seg=8,parent=world){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c),x,y,z,parent)}
function cone(r,h,c,x,y,z,n=5,parent=world){return mesh(new THREE.ConeGeometry(r,h,n),mat(c),x,y,z,parent)}
function makeTree(x,z,s=1){const g=new THREE.Group();world.add(g);cylinder(.09*s,.13*s,.65*s,0x6b472b,x,.32*s,z,6,g);for(let i=0;i<3;i++)cone((.48-i*.07)*s,.8*s, i===1?0x315d38:0x3e7040,x,(.7+i*.36)*s,z,7,g);g.position.y=0;return g}
function makeRock(x,z,s=1){const r=mesh(new THREE.DodecahedronGeometry(.38*s,0),mat(0x858b83),x,.22*s,z);r.scale.y=.7}
function path(x,z,w,l,rot=0){const p=box(w,.035,l,0xb7a078,x,.025,z);p.rotation.y=rot;return p}
function makeHouse(x,z,scale=1,roofColor=0x774a2c){const g=new THREE.Group();world.add(g);box(.95*scale,.68*scale,.82*scale,0xc9b38a,x,.35*scale,z,g);box(.13*scale,.72*scale,.13*scale,0x60452f,x-.37*scale,.36*scale,z+.34*scale,g);box(.13*scale,.72*scale,.13*scale,0x60452f,x+.37*scale,.36*scale,z+.34*scale,g);const roof=mesh(new THREE.ConeGeometry(.78*scale,.58*scale,4),mat(roofColor),x,.91*scale,z,g);roof.rotation.y=Math.PI/4;box(.2*scale,.38*scale,.05*scale,0x4d3221,x,.2*scale,z+.42*scale,g);box(.18*scale,.2*scale,.04*scale,0x91b8bd,x-.22*scale,.45*scale,z+.421*scale,g);return g}
function makeTower(x,z,scale=1){const g=new THREE.Group();world.add(g);box(.82*scale,1.5*scale,.82*scale,0x99998b,x,.75*scale,z,g);box(.9*scale,.12*scale,.9*scale,0xb0ad9a,x,1.53*scale,z,g);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(Math.abs(i)+Math.abs(j)>1)box(.2*scale,.25*scale,.2*scale,0xb8b5a4,x+i*.27*scale,1.68*scale,z+j*.27*scale,g);box(.85*scale,.08*scale,.85*scale,0x3b454b,x,1.84*scale,z,g);const flag=box(.045*scale,.55*scale,.035*scale,0x4d82c6,x+.12*scale,2.12*scale,z,g);flag.rotation.z=-.08;box(.3*scale,.2*scale,.04*scale,0x3766a6,x+.28*scale,2.28*scale,z,g);return g}
function makeKeep(){const g=new THREE.Group();world.add(g);const stone=0x98988a;box(2.2,.9,2,stone,0,.45,0,g);box(1.5,1.5,1.35,0xb2ac99,0,.95,-.1,g);box(1.55,.12,1.4,0x555d5d,0,1.73,-.1,g);box(.38,.75,.06,0x4a3020,0,.36,1.015,g);for(const [x,z] of [[-1,-.9],[1,-.9],[-1,.9],[1,.9]]){const t=new THREE.Group();g.add(t);box(.72,1.75,.72,stone,x,.87,z,t);box(.8,.13,.8,0xb8b3a4,x,1.79,z,t);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(Math.abs(i)+Math.abs(j)>1)box(.19,.22,.19,0xc4bdac,x+i*.25,1.96,z+j*.25,t);cone(.48,.58,0x364b5b,x,2.27,z,4,t);box(.04,.5,.04,0xc6b06c,x+.1,2.8,z,t);box(.3,.18,.035,0x386db0,x+.24,2.86,z,t)}return g}
function makeMill(x,z){const g=new THREE.Group();world.add(g);box(1.15,.68,.9,0x795332,x,.34,z,g);box(1.28,.12,1.02,0x4e3828,x,.72,z,g);for(let i=0;i<4;i++)box(.12,.75,.12,0x69462b,x-.48+i*.32,.36,z+.42,g);box(.7,.1,.1,0x8b6944,x,.55,z+.53,g);for(let i=0;i<4;i++)cylinder(.05,.05,.65,0x986c3c,x+.72,.23,z-.3+i*.18,6,g)}
function makeFarm(x,z){const g=new THREE.Group();world.add(g);box(1.65,.05,1.45,0x8a7043,x,.05,z,g);for(let i=0;i<6;i++){const row=box(.08,.09,1.28,i%2?0xb7a64e:0xd1b85e,x-.62+i*.25,.11,z,g);row.rotation.z=-.08}makeHouse(x+.98,z-.25,.55,0x80502d)}
function makeQuarry(x,z){for(let i=0;i<7;i++){const r=mesh(new THREE.DodecahedronGeometry(.3+Math.random()*.16),mat(i%2?0x8b908d:0xaaa99a),x+(Math.random()-.5)*1.2,.2+Math.random()*.12,z+(Math.random()-.5)*1.1);r.rotation.set(Math.random(),Math.random(),Math.random())}box(.09,.7,.09,0x684a2b,x+.65,.35,z+.5)}
function makeBarracks(x,z){makeHouse(x,z,1.3,0x4b5360);box(.08,.9,.08,0xb4b5ad,x-.5,.5,z+.62);box(.4,.25,.04,0x396db1,x-.28,.8,z+.62)}
function makeRoads(){path(0,2.4,1.25,5.8);path(0,-2.3,1.1,3.1);path(2.8,1.5,4.4,.8,-.45);path(-2.7,2,3.7,.7,.4);path(3.1,4,3.3,.65,-.2)}
function makeRiver(){const points=[];for(let i=0;i<9;i++)points.push(new THREE.Vector3(-10+i*2.5,.01,6.5-Math.sin(i*.68)*2.3));const curve=new THREE.CatmullRomCurve3(points);const verts=[],indices=[];const n=100;for(let i=0;i<=n;i++){const t=i/n,p=curve.getPoint(t),tan=curve.getTangent(t),nx=-tan.z,nz=tan.x;const len=Math.hypot(nx,nz)||1;for(const side of [-1,1])verts.push(p.x+nx/len*side*1.05,.005,p.z+nz/len*side*1.05);if(i<n){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const water=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x347d99,roughness:.22,metalness:.18,side:THREE.DoubleSide}));water.receiveShadow=true;world.add(water);for(let i=0;i<8;i++){const p=curve.getPoint(i/8);box(.18,.018,.045,0x9ad5dc,p.x,.03,p.z)}// stone bridge crossing the river
for(let i=0;i<7;i++)box(.45,.18,1.5,0xaaa896,-1.0+i*.34,.13,4.2);for(const x of [-1.1,1.2]){box(.1,.24,1.65,0x776f60,x,.29,4.2)}}
function rebuild(){while(world.children.length)world.remove(world.children[0]);const grass=mat(0x6e8c52);ground=mesh(new THREE.PlaneGeometry(34,30),grass,0,-.12,0);ground.rotation.x=-Math.PI/2;ground.userData.ground=true;const grassPatch=mesh(new THREE.PlaneGeometry(25,21),mat(0x78955a),0,-.105,0);grassPatch.rotation.x=-Math.PI/2;grassPatch.userData.ground=true;
makeRiver();makeRoads();
// fortress enclosure: four thick walls with crenellations and four detailed towers
const wall=0x929385;box(7,.95,.42,wall,0,.48,-2.4);box(7,.95,.42,wall,0,.48,2.4);box(.42,.95,4.5,wall,-3.3,.48,0);box(.42,.95,4.5,wall,3.3,.48,0);
for(let x=-3.05;x<=3.06;x+=.48){for(const z of [-2.4,2.4])box(.25,.22,.28,0xb2b0a2,x,1.04,z)}
for(let z=-2;z<=2.01;z+=.48)for(const x of [-3.3,3.3])box(.28,.22,.25,0xb2b0a2,x,1.04,z);
for(const [x,z] of [[-3.3,-2.4],[3.3,-2.4],[-3.3,2.4],[3.3,2.4]])makeTower(x,z,.95);
makeKeep();makeHouse(-1.65,-1.25,.78,0x4b5660);makeHouse(1.55,-1.25,.82,0x86542d);makeHouse(-1.3,.9,.68,0x6b4a2c);makeMill(1.9,1.0);
// main gate and road
box(1.2,.8,.25,0x827e70,0,.42,2.4);box(.72,.68,.08,0x503522,0,.35,2.54);box(.1,.82,.12,0xc5a264,-.46,.4,2.55);box(.1,.82,.12,0xc5a264,.46,.4,2.55);
makeFarm(5,1.9);makeHouse(4.9,.4,.76,0x81542e);makeHouse(5.4,4.1,.72,0x5a4d3d);makeMill(-5,1.5);makeQuarry(6,-1.5);makeBarracks(2.7,4.1);
// fenced fields
for(const x of [4.05,5.95]){box(.07,.32,2.1,0x6c4b2e,x,.16,1.9);box(.07,.32,2.1,0x6c4b2e,x,.16,1.9)}for(const z of [.85,2.95])box(1.9,.32,.07,0x6c4b2e,5,.16,z);
// trees on outskirts; avoid central castle
for(let i=0;i<90;i++){let x=(Math.random()-.5)*28,z=(Math.random()-.5)*23;if(Math.abs(x)<4.4&&Math.abs(z)<3.7)continue;if(x>3&&z>-1&&z<5.5)continue;if(z>5.2&&x>-2&&x<2.5)continue;makeTree(x,z,.65+Math.random()*.75)}
for(let i=0;i<26;i++){const x=(Math.random()>.5?1:-1)*(4.5+Math.random()*7),z=(Math.random()-.5)*13;makeRock(x,z,.6+Math.random()*.9)}
// tiny pennants outside and garden plots
for(let i=0;i<9;i++){const x=-2.6+i*.65;box(.025,.42,.025,0x57452d,x,.21,3.3);box(.22,.12,.025,0x386db1,x+.1,.34,3.3)}
// make interactable building hit targets, each structure receives cell metadata
for(const child of world.children){if(child.userData&&child.userData.ground)continue;}
}
function init(){if(!window.THREE){say('Не загрузилась 3D-библиотека. Проверь интернет и обнови страницу.');return}scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb4a0);scene.fog=new THREE.Fog(0x9fb4a0,22,48);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(11,13,15);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;scene.add(new THREE.HemisphereLight(0xeaf5d8,0x485440,2.1));const sun=new THREE.DirectionalLight(0xffe5bd,3.0);sun.position.set(-8,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);world=new THREE.Group();scene.add(world);raycaster=new THREE.Raycaster();rebuild();ready=true;hud();animate();say('Королевство загружено. Вращай карту и выбирай строительство.')}
function animate(){requestAnimationFrame(animate);if(ready)renderer.render(scene,camera)}
function focus(){camera.position.set(11*zoom,13*zoom,15*zoom);camera.lookAt(0,0,0)}
function chooseBuild(type){state.selected=state.selected===type?null:type;document.querySelectorAll('[data-build]').forEach(b=>b.classList.toggle('active',b.dataset.build===state.selected));status.innerHTML=state.selected?'Выбрано: '+NAMES[state.selected]+'<br>Коснись участка за пределами крепости.':'Королевство развивается<br>Выбери постройку внизу';}
function cellFromEvent(e){const rect=canvas.getBoundingClientRect();const p=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(p,camera);const hits=raycaster.intersectObjects(world.children,true);for(const h of hits){let o=h.object;while(o.parent&&o.parent!==world)o=o.parent;if(o===ground||o.userData.ground){return {x:Math.round(h.point.x),z:Math.round(h.point.z)}}}return null}
function actAt(e){const p=cellFromEvent(e);if(!p)return;const x=Math.round(p.x),z=Math.round(p.z),key=x+','+z;if(Math.abs(x)<4&&Math.abs(z)<3){say('Это территория крепости. Выбери свободный участок снаружи.');return}if(!state.selected){const resources=['wood','stone','food'];const r=resources[Math.floor(Math.random()*resources.length)];state.resources[r]+=4;hud();say('Собрано немного '+({wood:'дерева',stone:'камня',food:'еды'}[r])+'.');save();return}const cost=COST[state.selected];for(const [r,n] of Object.entries(cost)){if(state.resources[r]<n){say('Не хватает ресурсов.');return}}for(const [r,n] of Object.entries(cost))state.resources[r]-=n;state.buildings[key]=state.selected;const type=state.selected;state.selected=null;rebuild();hud();document.querySelectorAll('[data-build]').forEach(b=>b.classList.remove('active'));status.innerHTML=NAMES[type]+' построена!<br>Продолжай развивать поселение.';save();say(NAMES[type]+' построена!')}
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};lastX=e.clientX;lastY=e.clientY;drag=false;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>5)drag=true;if(drag){camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.005);camera.position.y=Math.max(6,Math.min(23,camera.position.y+dy*.025));camera.lookAt(0,0,0)}lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',e=>{if(down&&!drag)actAt(e);down=null});
canvas.addEventListener('wheel',e=>{zoom=Math.max(.65,Math.min(1.6,zoom*(e.deltaY>0?1.08:.92)));focus()},{passive:true});
document.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>chooseBuild(b.dataset.build)));
document.getElementById('gather').addEventListener('click',()=>{const r=['wood','stone','food','gold'][Math.floor(Math.random()*4)];state.resources[r]+=8;hud();save();say('Получено +8: '+({wood:'дерево',stone:'камень',food:'еда',gold:'золото'}[r]))});
document.getElementById('saveBtn').addEventListener('click',save);
document.getElementById('cameraBtn').addEventListener('click',()=>{camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),Math.PI/4);camera.lookAt(0,0,0);say('Камера повёрнута')});
document.getElementById('resetView').addEventListener('click',()=>{zoom=1;focus();say('Обзор королевства восстановлен')});
document.getElementById('buildMode').addEventListener('click',()=>{document.getElementById('bottom').scrollIntoView({behavior:'smooth',block:'end'});say('Выбери постройку внизу экрана')});
window.addEventListener('resize',()=>{if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
