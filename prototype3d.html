<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172019">
<title>KINGDOMS — 3D прототип</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172019;color:#f3f0df;font-family:Arial,Helvetica,sans-serif}#world{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:2;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px;border:1px solid #65725a;border-radius:14px;background:#172019e8;backdrop-filter:blur(8px)}.brand{font-weight:900;letter-spacing:.08em;color:#e5bd69;margin-right:auto}.resource{font-size:12px;padding:6px 8px;border-radius:8px;background:#2b392d;white-space:nowrap}.resource b{color:#e5bd69}.tools{position:fixed;z-index:2;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;padding:9px;border:1px solid #65725a;border-radius:14px;background:#172019ed}.tools button,.topbutton{border:1px solid #667660;border-radius:9px;padding:10px 11px;background:#314535;color:#fff;font-weight:700;font-size:12px}.tools button.active{background:#c99a43;color:#17150f;border-color:#e5bd69}.tools button:disabled{opacity:.4}.hint{width:100%;font-size:12px;color:#d1d8c9;padding:2px 3px}.toast{position:fixed;z-index:3;top:82px;left:50%;transform:translateX(-50%);max-width:90vw;padding:9px 12px;border-radius:10px;background:#101510eF;border:1px solid #68765e;font-size:13px;text-align:center;pointer-events:none}.top-actions{position:fixed;right:12px;top:80px;z-index:2}.topbutton{background:#172019e8}.modal{position:fixed;z-index:5;inset:0;background:#101510df;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(420px,100%);border:1px solid #65725a;border-radius:18px;background:#202c24;padding:22px}.dialog h1{color:#e5bd69;margin-top:0}.dialog p{line-height:1.5;color:#d1d8c9}.dialog input{width:100%;padding:12px;border-radius:9px;border:1px solid #65725a;background:#111812;color:white;font-size:16px;margin:8px 0 14px}.dialog button{width:100%;padding:13px;border:0;border-radius:9px;background:#c99a43;color:#17150f;font-weight:bold}.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="world" aria-label="Объёмный мир KINGDOMS"></canvas>
<div class="hud"><div class="brand">⚔ KINGDOMS · 3D</div><div class="resource">🪵 <b id="wood">120</b></div><div class="resource">🪨 <b id="stone">90</b></div><div class="resource">🌾 <b id="food">150</b></div><div class="resource">🪙 <b id="gold">85</b></div></div>
<div class="top-actions"><button class="topbutton" id="menuBtn">Меню</button></div>
<div class="toast" id="toast">Загрузка 3D-мира…</div>
<div class="tools" id="tools">
<button data-build="lumberMill">Лесопилка · 30🪵 12🪨</button>
<button data-build="quarry">Каменоломня · 22🪵 8🪨</button>
<button data-build="farm">Ферма · 28🪵 12🪨 10🪙</button>
<button data-build="barracks">Казармы · 36🪵 24🪨 18🪙</button>
<button id="gather">Собрать ресурсы</button><button id="cancel">Отмена</button>
<div class="hint" id="hint">Выбери здание, затем коснись свободного участка. Перетаскивай мир для поворота, используй два пальца для масштаба.</div>
</div>
<div class="modal" id="startModal"><div class="dialog"><h1>KINGDOMS</h1><p>Первый объёмный прототип. Строй крепость и развивай поселение. Прогресс хранится на этом устройстве.</p><label for="ruler">Имя правителя</label><input id="ruler" maxlength="20" value="Правитель"><button id="startBtn">Начать / продолжить</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const SAVE='kingdoms-3d-save-v1', W=11, COST={lumberMill:{wood:30,stone:12},quarry:{wood:22,stone:8},farm:{wood:28,stone:12,gold:10},barracks:{wood:36,stone:24,gold:18}};
const NAMES={keep:'Крепость',lumberMill:'Лесопилка',quarry:'Каменоломня',farm:'Ферма',barracks:'Казармы'};
const state={ruler:'Правитель',resources:{wood:120,stone:90,food:150,gold:85},buildings:{'5,5':'keep'},nodes:{},selected:null};
let scene,camera,renderer,raycaster,ground,root,dragging=false,lastX=0,lastY=0,pinch=0,viewScale=1,ready=false;
const canvas=document.getElementById('world'),toast=document.getElementById('toast'),hint=document.getElementById('hint');
const say=(s)=>{toast.textContent=s;toast.classList.remove('hidden');clearTimeout(say.timer);say.timer=setTimeout(()=>toast.classList.add('hidden'),2400)};
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state));}catch(e){say('Браузер не разрешил сохранить прогресс.');}}
function restore(){try{const raw=localStorage.getItem(SAVE);if(!raw)return false;const s=JSON.parse(raw);if(!s||!s.resources||!s.buildings||typeof s.buildings!=='object')return false;state.ruler=typeof s.ruler==='string'?s.ruler:'Правитель';for(const k of ['wood','stone','food','gold'])state.resources[k]=Number.isFinite(+s.resources[k])&&+s.resources[k]>=0?+s.resources[k]:0;state.buildings={};for(const [k,v] of Object.entries(s.buildings)){if(/^\d+,\d+$/.test(k)&&['keep',...Object.keys(COST)].includes(v))state.buildings[k]=v;}if(!Object.values(state.buildings).includes('keep'))state.buildings['5,5']='keep';state.nodes=s.nodes&&typeof s.nodes==='object'?s.nodes:{};return true;}catch(e){say('Старое сохранение не прочиталось; начата новая игра.');return false;}}
function hud(){for(const k of ['wood','stone','food','gold'])document.getElementById(k).textContent=Math.floor(state.resources[k]);}
function init3d(){if(!window.THREE){say('Не загрузилась 3D-библиотека. Проверь интернет и обнови страницу.');return;}scene=new THREE.Scene();scene.background=new THREE.Color(0x9eae91);scene.fog=new THREE.Fog(0x9eae91,24,54);camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(10,13,16);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene.add(new THREE.HemisphereLight(0xeaf3d8,0x59614b,2));const sun=new THREE.DirectionalLight(0xffe5b5,2.5);sun.position.set(-8,16,9);sun.castShadow=true;scene.add(sun);root=new THREE.Group();scene.add(root);raycaster=new THREE.Raycaster();const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const base=new THREE.Mesh(new THREE.PlaneGeometry(W,W),mat(0x82956b));base.rotation.x=-Math.PI/2;base.position.y=-.08;base.receiveShadow=true;base.userData.cell='ground';root.add(base);ground=base;
for(let i=0;i<=W;i++){for(const vertical of [true,false]){const line=new THREE.Mesh(new THREE.BoxGeometry(vertical?.025:W,.012,vertical?W:.025),mat(0x667b58));line.position.set(vertical?i-W/2:0,-.055,vertical?0:i-W/2);root.add(line);}}
if(!Object.keys(state.nodes).length){const types=['wood','stone','food','gold'];for(let y=0;y<W;y++)for(let x=0;x<W;x++){if(Math.random()<.105&&!(x===5&&y===5))state.nodes[x+','+y]=types[Math.floor(Math.random()*types.length)];}}
rebuild();ready=true;animate();say('3D-мир готов. Коснись участка для строительства.');}
function makeBuilding(type,x,z){const g=new THREE.Group();const M=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.88});const stone=M(type==='keep'?0x8b8b7d:0x9b9c8c),roof=M(type==='keep'?0x4b504b:0x6e4c31),wood=M(0x755033),green=M(0x608344);
function box(w,h,d,mat,px,py,pz){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(px,py,pz);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;}
function cone(r,h,mat,px,py,pz,n=4){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),mat);m.position.set(px,py,pz);m.rotation.y=Math.PI/4;m.castShadow=true;g.add(m);}
if(type==='keep'){box(1.1,.8,1.1,stone,0,.4,0);box(.42,1.25,.42,stone,0,1.025,0);cone(.42,.55,roof,0,1.92,0,4);for(const [a,b] of [[-.42,-.42],[.42,-.42],[-.42,.42],[.42,.42]]){box(.23,.68,.23,stone,a,.74,b);cone(.17,.25,roof,a,1.2,b);}}
if(type==='lumberMill'){box(1,.65,.85,wood,0,.325,0);box(1.15,.12,1,roof,0,.72,0);box(.12,.75,.12,wood,-.38,.35,.32);box(.12,.75,.12,wood,.38,.35,.32);box(.6,.08,.08,stone,0,.4,.5);}
if(type==='quarry'){for(let i=0;i<5;i++){const b=box(.35,.25,.32,stone,(i%3-.9)*.28,.13+Math.floor(i/3)*.22,(Math.floor(i/3)-.5)*.3);b.rotation.y=i*.35;}box(.18,.8,.18,wood,.55,.4,.35);}
if(type==='farm'){box(1,.1,.9,wood,0,.05,0);for(let i=0;i<5;i++){const row=box(.055,.08,.95,green,-.4+i*.2,.12,0);row.rotation.z=.15;}box(.4,.38,.35,wood,.45,.19,-.25);cone(.32,.35,roof,.45,.55,-.25,4);}
if(type==='barracks'){box(1,.55,.8,stone,0,.275,0);box(1.1,.12,.9,roof,0,.6,0);box(.1,.7,.1,wood,-.32,.35,.42);box(.1,.7,.1,wood,.32,.35,.42);box(.45,.05,.05,0xb9c3bc,0,.6,.48);}
g.position.set(x,0,z);g.userData={cellX:Math.round(x+W/2-.5),cellY:Math.round(z+W/2-.5),type};return g;}
function nodeMesh(type,x,z){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:type==='wood'?0x37643a:type==='stone'?0x999d9c:type==='food'?0xc8a94d:0xd9b44b,roughness:1});if(type==='wood'){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,.4,6),new THREE.MeshStandardMaterial({color:0x69472c}));trunk.position.y=.2;g.add(trunk);for(let i=0;i<3;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(.3-i*.04,.55,7),mat);t.position.y=.5+i*.25;g.add(t);}}else if(type==='stone'){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.28),mat);m.position.y=.22;m.scale.y=.8;g.add(m);}else{for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.4,.08),mat);m.position.set((i-1)*.13,.2,0);m.rotation.z=-.25;g.add(m);}}g.position.set(x,.02,z);g.userData={node:true,cellX:Math.round(x+W/2-.5),cellY:Math.round(z+W/2-.5)};return g;}
function rebuild(){while(root.children.length>1)root.remove(root.children[root.children.length-1]);for(const [key,type] of Object.entries(state.buildings)){const [cx,cy]=key.split(',').map(Number);root.add(makeBuilding(type,cx-W/2+.5,cy-W/2+.5));}for(const [key,type] of Object.entries(state.nodes)){const [cx,cy]=key.split(',').map(Number);if(!state.buildings[key])root.add(nodeMesh(type,cx-W/2+.5,cy-W/2+.5));}}
function animate(){requestAnimationFrame(animate);if(ready)renderer.render(scene,camera);}
function selectedCell(ev){const rect=canvas.getBoundingClientRect(),p=new THREE.Vector2((ev.clientX-rect.left)/rect.width*2-1,-(ev.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(p,camera);const hits=raycaster.intersectObjects(root.children,true);for(const h of hits){let o=h.object;while(o&&o.parent!==root&&o!==root)o=o.parent;if(o===ground){const x=Math.floor(h.point.x+W/2),y=Math.floor(h.point.z+W/2);if(x>=0&&x<W&&y>=0&&y<W)return {x,y,key:x+','+y};}if(o&&o.userData&&Number.isInteger(o.userData.cellX))return {x:o.userData.cellX,y:o.userData.cellY,key:o.userData.cellX+','+o.userData.cellY};}return null;}
function handleCell(cell){if(!cell)return;const key=cell.key;if(state.selected){if(state.buildings[key]){say('Это место уже занято.');return;}const cost=COST[state.selected];for(const [r,n] of Object.entries(cost)){if(state.resources[r]<n){say('Не хватает ресурсов для постройки.');return;}}for(const [r,n] of Object.entries(cost))state.resources[r]-=n;state.buildings[key]=state.selected;delete state.nodes[key];const name=NAMES[state.selected];state.selected=null;document.querySelectorAll('[data-build]').forEach(b=>b.classList.remove('active'));rebuild();hud();save();say(name+' построена.');return;}const node=state.nodes[key];if(node){const amounts={wood:5,stone:4,food:6,gold:3};state.resources[node]+=amounts[node]||3;delete state.nodes[key];rebuild();hud();save();say('Собраны ресурсы.');}else if(state.buildings[key])say(NAMES[state.buildings[key]]||'Постройка');else say('Выбери здание снизу, затем участок.');}
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId);});
canvas.addEventListener('pointerup',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;dragging=false;if(Math.abs(dx)+Math.abs(dy)<10)handleCell(selectedCell(e));});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(camera){camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.005);camera.position.y=Math.max(7,Math.min(22,camera.position.y+dy*.025));camera.lookAt(0,0,0);}});
canvas.addEventListener('wheel',e=>{if(!camera)return;camera.position.multiplyScalar(e.deltaY>0?1.06:.94);camera.position.y=Math.max(7,Math.min(25,camera.position.y));camera.lookAt(0,0,0);},{passive:true});
document.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>{state.selected=state.selected===b.dataset.build?null:b.dataset.build;document.querySelectorAll('[data-build]').forEach(q=>q.classList.toggle('active',q===b&&!!state.selected));hint.textContent=state.selected?'Выбрано: '+NAMES[state.selected]+'. Коснись свободного участка.':'Выбери здание, затем коснись участка.';}));
document.getElementById('cancel').addEventListener('click',()=>{state.selected=null;document.querySelectorAll('[data-build]').forEach(b=>b.classList.remove('active'));});
document.getElementById('gather').addEventListener('click',()=>{const keys=Object.keys(state.nodes);if(!keys.length){say('Рядом нет ресурсов.');return;}const k=keys[Math.floor(Math.random()*keys.length)],type=state.nodes[k],amount=type==='food'?7:5;state.resources[type]+=amount;delete state.nodes[k];rebuild();hud();save();say('Собрано '+amount+' ресурсов.');});
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('startModal').classList.remove('hidden'));
document.getElementById('startBtn').addEventListener('click',()=>{state.ruler=(document.getElementById('ruler').value||'Правитель').trim().slice(0,20)||'Правитель';document.getElementById('startModal').classList.add('hidden');if(!ready)init3d();else {hud();save();say('С возвращением, '+state.ruler+'!');}save();});
window.addEventListener('resize',()=>{if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
if(restore()){document.getElementById('ruler').value=state.ruler;hud();}
})();
</script>
</body>
</html>
